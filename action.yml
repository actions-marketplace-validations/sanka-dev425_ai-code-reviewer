name: Aegis AI Code Review Engine
description: Automated GitHub pull request reviews with Claude, posting inline comments on changed lines.
author: sanka-dev425

inputs:
  github_token:
    description: GitHub token for posting comments
    required: true
  anthropic_api_key:
    description: Anthropic Claude API key
    required: true
  model:
    description: Claude model to use
    required: false
    default: claude-sonnet-4-20250514
  review_level:
    description: "Options: quick | standard | deep"
    required: false
    default: standard
  ignore_patterns:
    description: Comma-separated glob patterns to skip (e.g. "*.md,*.lock")
    required: false
    default: "*.md,*.lock,*.json,dist/**"
  max_files:
    description: Max number of files to review per PR
    required: false
    default: "20"
  post_summary:
    description: Post an overall PR summary comment
    required: false
    default: "true"

runs:
  using: node20
  main: dist/index.js

branding:
  icon: code
  color: purple
